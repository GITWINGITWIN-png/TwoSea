    (2) ช่องเล็กมุมจอ: เกณฑ์ต้องสูงขึ้นตามจำนวนดัชนี 0.59 → 0.96 (บันไดย่อ) (3) เส้นแดงทึบ ดัชนีปลอมหลังปรับเกณฑ์ ราบใต้ 5%
    · ฟอง "ของจริงรวมแล้วเพิ่มได้สูงสุด +0.6 จุด" · **ดัชนีจริง (น้ำเงิน) คู่กับดัชนีปลอมทุกขั้น** (ผู้ใช้ 10-14): เกณฑ์เดิมไต่
    9.3 → 98.5 แบบเดียวกัน · ปรับเกณฑ์แล้วราบราว 9–10 อยู่เหนือดัชนีปลอม'
