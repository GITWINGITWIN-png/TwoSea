    "10": {lit: "DMI 10°S–10°N"}
    "90": {lit: "DMI กล่องตะวันออก 90°E"}
    "110": {lit: "DMI กล่องตะวันออก 110°E · WNPMI กล่องเหนือ 110°E"}
    "15": {lit: "WNPMI กล่องใต้ 15°N"}
    "100": {lit: "WNPMI กล่องใต้ 100°E"}
    "130": {lit: "WNPMI กล่องใต้ 130°E"}
    "20": {lit: "WNPMI กล่องเหนือ 20°N · PDO เหนือ 20°N"}
    "30": {lit: "WNPMI กล่องเหนือ 30°N"}
