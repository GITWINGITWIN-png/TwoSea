C94:
  says: >-
    นิยามดัชนีทั้งแปดตัว — Niño3.4 = อุณหภูมิผิวน้ำเฉลี่ยกล่อง 5°S–5°N 170°W–120°W (El Niño เป็นบวก) ·
    SOI = ความกดอากาศ ตาฮิติ − ดาร์วิน (El Niño เป็นลบ) · DMI = อุณหภูมิผิวน้ำกล่องตะวันตก 50–70°E 10°S–10°N ลบกล่องตะวันออก
    90–110°E 10°S–ศูนย์สูตร (IOD บวกเป็นบวก) · WNPMI = ลม 850 hPa กล่อง 5–15°N 100–130°E ลบกล่อง 20–30°N 110–140°E
    (Wang & Fan 1999 · โครงงานประกอบเองจาก U850) · PDO = รูปแบบหลักตัวแรกของอุณหภูมิผิวน้ำแปซิฟิกเหนือ เหนือ 20°N (Mantua et al. 1997) ·
    TPI = อุณหภูมิผิวน้ำแปซิฟิกศูนย์สูตรกลาง ลบค่าเฉลี่ยแปซิฟิกตะวันตกเฉียงเหนือและใต้ (Henley et al. 2015) ·
    AMO = อุณหภูมิผิวน้ำแอตแลนติกเหนือ (สิ้นสุดปี 2023) · NAO = โหมดความกดอากาศแอตแลนติกเหนือ (Hurrell et al. 2003) · ทุกตัวจาก NOAA PSL
  report: >-
    §2 ตารางข้อมูล (ทุกดัชนี · เครื่องหมาย ENSO/IOD ในกล่อง "รู้จัก ENSO และ IOD") · พิกัดกล่อง Niño3.4 / DMI / WNPMI = BOXES ใน
    scripts/make_infographics.py (ที่วาดรูป map01_indices ของรายงาน) · PDO / TPI / NAO = docs/source-paper-detail.md §2.3 ·
    แหล่งไฟล์ = scripts/fetch_data.py
