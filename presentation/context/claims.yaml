# ข้อเท็จจริงทุกข้อที่บทพูด — ผูกกับรายงานและกับ data/facts.json
#
# แต่ละ claim:
#   says      สิ่งที่บทพูด (ย่อ)
#   report    ที่มาในรายงาน (หัวข้อ/รูป) และงานวิจัยที่รายงานอ้าง
#   evidence  strong (หนักแน่น) · single (งานเดียว) · inferred (อนุมาน) · data (คำนวณจากข้อมูล) · method · course · analogy
#   numbers   ตัวเลขทุกตัวที่ปรากฏในประโยค -> ต้องตรงกับ fact (tools/check_claims.py ตรวจ)
#               fact: key ใน facts.json · fmt: รูปแบบ · round: ปัดหลัก (−1 = สิบ) · abs: ค่าสัมบูรณ์
#               index: ตำแหน่งในลิสต์ · in: ต้องอยู่ในลิสต์ · below: ทุกค่าต้องต่ำกว่าเลขนี้ · lit: ค่าคงที่ (บอกเหตุผล)
#   note      สิ่งที่ย่อ/ระวัง

C01:
  says: ปี 1997–98 ทะเลหน้าภูเก็ตต่ำกว่าปกติราว 29 ซม. นาน 7 เดือน จนปะการังบนพื้นราบตาย
  report: "§4 · Brown et al. (2019)"
  evidence: strong
  numbers:
    "1997": {lit: ปีเหตุการณ์ตามรายงาน §4}
    "98": {lit: ปีเหตุการณ์ 1997–98}
    "29": {fact: event.phuket_drop_cm, fmt: "{:.0f}"}
    "7": {fact: event.phuket_drop_months, fmt: "{:.0f}"}
  note: ใช้ถ้อยคำของรายงาน ไม่บอกจำนวนปะการังที่ตาย · 29 ซม. เป็นรายงานภาคสนาม คนละอย่างกับ 210 มม. (ค่าเฉลี่ย 12 เดือน, C20)

