[project]
name = "two-seas"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "manim>=0.22",
    "manim-slides[pyside6]==5.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyshp>=3.1.6",
    "pythainlp>=5.3.8",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
